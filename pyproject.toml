[project]
name = "conversiq"
version = "0.1.0"
description = "Voice-first document RAG system."
requires-python = ">=3.11,<3.12"
dependencies = [
    "groq>=0.37.1",
    "ipykernel",
    "jupyter",
    "langchain-groq>=1.1.3",
    "langgraph>=1.2.11",
    "onnxruntime>=1.30.0",
    "pageindex>=0.2.12",
    "piper-tts>=1.8.0",
    "pymupdf",
    "python-dotenv",
    "sounddevice>=0.5.6",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
